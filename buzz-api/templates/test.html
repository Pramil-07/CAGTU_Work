<!DOCTYPE html>
<html>
<head>
<style>
.customers {
  font-family: Arial, Helvetica, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

.customers td, #customers th {
  border: 1px solid #ddd;
  padding: 8px;
}

.customers tr:nth-child(even){background-color: #f2f2f2;}



.customers th {
  padding-top: 12px;
  padding-bottom: 12px;
  text-align: left;
  background-color: #981B1F;
  color: white;
}
</style>
</head>
<body>


<div class="">Dear user, Here is you order Summary. </div>

         

                <h2 class="legend delivery">Order Summary</h2>
                <table class="customers">
                    <tr>
                        <th >Product Name</th>
                        <th >Model No</th>
                        <th >Quantity</th>
                        <th >Unit Price</th>
                        <th >Total</th>
                    </tr>
            
            

                    <tr>
                        <td >	{{domain}}/verify?u={{uid}}&t={{token}}
                        </td>
                        <td >{{ user }}</td>
                        <td >{{ email }}</td>

                    </tr>
                

              
                    <tr>
                        <td colspan="4" class="text-right"><strong>Flat Shipping
                                Rate:</strong></td>
                        <td class="text-right">Free (Inside Valley Only)</td>
                    </tr>

                    <tr>
                        <td colspan="4" class="text-right"><strong>Grand Total:</strong></td>
                        <td class="text-right">Nrs. {{my_order.get_total }}</td>
                    </tr>
                  
                </table>

            

  
</body>
</html>
